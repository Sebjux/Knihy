<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktívna kniha - Hlasové Čítanie</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #eef2f5;
      padding: 40px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .book-viewport {
      width: 100%;
      max-width: 620px;
      height: 580px;
      perspective: 2000px;
      position: relative;
    }

    .book-container {
      width: 100%;
      height: 100%;
      background: #fdfbf7;
      box-sizing: border-box;
      border-radius: 4px 16px 16px 4px;
      box-shadow: 
        -10px 0 15px rgba(0,0,0,0.1),
        inset 20px 0 30px rgba(0,0,0,0.03), 
        0 10px 25px rgba(0,0,0,0.15);
      border-left: 10px solid #5a6268;
      position: relative;
    }

    h1 {
      font-family: sans-serif;
      font-size: 16px;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .reader-paragraph {
      font-size: 17.5px;
      line-height: 1.75;
      color: #2c3e50;
      text-align: justify;
      margin-bottom: 16px;
    }

    .word {
      cursor: pointer;
      border-bottom: 1px dotted #bdc3c7;
      transition: background-color 0.2s;
      border-radius: 3px;
      padding: 0 2px;
    }

    .word:hover {
      background-color: #e8f4f8;
      border-bottom: 1px solid #3498db;
    }

    .phrase-highlight {
      background-color: #fff3cd;
      border-bottom: 2px solid #ffca28;
      font-weight: 500;
    }

    /* AKTUÁLNE ČÍTANÉ SLOVO */
    .word-reading {
      background-color: #ff7675 !important;
      color: #ffffff !important;
      border-radius: 4px;
      padding: 2px 4px;
      transition: all 0.1s ease;
    }

    .paper-sheet {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .paper-sheet.flipped {
      transform: rotateY(-180deg);
    }

    .page-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 35px 40px;
      box-sizing: border-box;
      background: #fdfbf7;
      border-radius: 0 16px 16px 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .page-front { z-index: 2; }
    .page-back {
      transform: rotateY(180deg);
      z-index: 1;
      border-radius: 16px 0 0 16px;
      background: #faf6ee;
    }

    .page-face::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: linear-gradient(to right, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0) 8%);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 40px;
      right: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
      font-family: sans-serif;
      z-index: 1000;
    }

    .nav-btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav-btn:hover:not(:disabled) { background-color: #2980b9; }
    .nav-btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }

    /* PLAY/STOP TLAČIDLO */
    .play-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .play-btn.playing { background-color: #e74c3c; }

    .page-number { font-size: 14px; color: #94a3b8; font-weight: bold; }

    .popover {
      position: absolute;
      display: none;
      width: 250px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 16px;
      text-align: center;
      z-index: 2000;
      border: 1px solid #e1e8ed;
      font-family: sans-serif;
    }

    .popover-header { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .popover-word { font-size: 18px; font-weight: bold; color: #2c3e50; }
    .audio-btn { background: none; border: none; cursor: pointer; font-size: 18px; padding: 2px 6px; border-radius: 50%; }
    .audio-btn:hover { background: #f0f0f0; }
    .popover-ipa { font-size: 13px; color: #7f8c8d; margin: 4px 0 10px 0; }
    .popover-translation { font-size: 16px; font-weight: 600; color: #27ae60; margin-bottom: 12px; }
    .popover-actions { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-know { background-color: #2ecc71; color: white; }
    .btn-learn { background-color: #f1c40f; color: white; }
  </style>
</head>
<body>

<div class="book-viewport">
  <div class="book-container">
    
    <div id="pages-wrapper"></div>

    <div class="controls">
      <button class="nav-btn" id="prev-btn" onclick="manualChangePage(-1)" disabled>← Späť</button>
      <button class="play-btn" id="play-btn" onclick="togglePlay()">▶ Prehrať</button>
      <span class="page-number" id="page-num">Strana 1 z 10</span>
      <button class="nav-btn" id="next-btn" onclick="manualChangePage(1)">Ďalej →</button>
    </div>

    <div id="popover" class="popover">
      <div class="popover-header">
        <span id="pop-word" class="popover-word">word</span>
        <button id="pop-audio-btn" class="audio-btn" title="Prehrať výslovnosť">🔊</button>
      </div>
      <div id="pop-ipa" class="popover-ipa">| ... |</div>
      <div id="pop-translation" class="popover-translation">Načítavam...</div>
      
      <div class="popover-actions">
        <button class="btn btn-know" onclick="action('Viem')">Viem</button>
        <button class="btn btn-learn" onclick="action('Učiť sa')">Učiť sa</button>
      </div>
    </div>

  </div>
</div>

<div class="ad-banner-container" style="
  width: 100%;
  max-width: 620px;
  margin-top: 25px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  background: #ffffff;
  line-height: 0;
  box-sizing: border-box;
">
  <a href="https://example.com" target="_blank" style="
    display: block;
    width: 100%;
    text-decoration: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  " onmouseover="this.style.opacity='0.95'; this.style.transform='scale(1.005)'" onmouseout="this.style.opacity='1'; this.style.transform='scale(1)'">
    <img src="https://placehold.co/620x180/3498db/ffffff?text=REKLAMA+%2F+SPONZOROVAN%C3%9D+BANNER" alt="Sponzorovaný banner" style="
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      border: 0;
      border-radius: 12px;
    ">
  </a>
</div>

<script>
  const phrasesList = [
    "looking forward to", "dense fog", "wandered around", "take a break",
    "ancient trees", "narrow path", "came across", "wooden cabin",
    "glowing light", "curious about", "step inside", "warm fireplace",
    "faded manuscript", "turned out to be", "secret door", "spiral staircase",
    "hidden chamber", "filled with", "golden chest", "take a step",
    "heavy breath", "iron key", "unlocked the lock", "shining bright",
    "lost track of time", "heading back", "safe and sound", "clear morning sky",
    "unforgettable journey", "deep forest", "sound of water", "looking back"
  ];

  const pagesData = [
    ["The autumn morning was chilly, and the sun was barely visible through the dense fog. Oliver had been looking forward to this weekend for weeks, hoping to escape the noise of the city.",
     "He grabbed his backpack, tightened his boots, and walked straight into the deep forest. The air smelled of pine needles and damp earth as he ventured deeper."],

    ["As he walked further, the trees grew taller and older. The wind whispered through the ancient trees, making a mysterious sound that echoed all around him.",
     "He wandered around for nearly two hours, following a narrow path that seemed to disappear into the thick bushes. Suddenly, he heard the faint sound of water in the distance."],

    ["Following the sound, he reached a small river flowing gently over smooth stones. On the opposite side, he came across an old wooden cabin that looked completely abandoned.",
     "Despite its age, there was a small glowing light coming from one of the side windows. Feeling extremely curious about who could live here, Oliver decided to cross the stream."],

    ["He carefully stepped on the slippery rocks until he reached the other bank. As he took a break near the entrance, he noticed that the heavy oak door was slightly open.",
     "He decided to step inside quietly. The air was warm, and a small fire was crackling in the warm fireplace, casting long shadows across the room."],

    ["In the center of the cabin stood a large wooden table covered with old maps and leather-bound books. On top of them lay a faded manuscript written in dark ink.",
     "As he examined the papers, it turned out to be a journal belonging to a scholar who had vanished decades ago while studying the forest."],

    ["While reading one of the pages, Oliver noticed a hidden pattern drawn in the margin. It pointed directly toward a bookshelf resting against the far wall.",
     "He approached the shelf and pulled a heavy green book. Suddenly, a quiet click echoed, and a secret door opened behind the cabinet."],

    ["Behind the door lay a narrow spiral staircase leading down into total darkness. Oliver pulled out his flashlight, took a heavy breath, and started descending the cold steps.",
     "The air grew cooler with every step he took. At the bottom, he stepped into a hidden chamber built entirely of ancient stone."],

    ["The chamber was filled with strange artifacts, carved statues, and old wooden boxes. In the center stood a table holding a decorated iron key.",
     "He picked up the key and noticed a small wooden box under the table. He unlocked the lock with a soft click, revealing a shining bright stone inside."],

    ["The stone emitted a gentle warm glow that lit up the entire room. Oliver lost track of time as he admired the object, realizing he had found something truly historical.",
     "He decided to leave everything as it was, taking only notes in his notebook before heading back up the stairs."],

    ["He stepped outside the cabin just as the fog began to clear, revealing a beautiful clear morning sky. It had been an unforgettable journey into the unknown.",
     "Looking back at the cabin one last time, Oliver smiled and began his walk back home, feeling completely safe and sound."]
  ];

  let currentSheetIndex = 0; 
  const totalPages = pagesData.length;
  const totalSheets = Math.ceil(totalPages / 2);
  let isAnimating = false;
  let currentAudioUrl = null;

  // HLASOVÉ PARSE A STATE VARS
  let isPlaying = false;
  let currentWordIndex = 0;
  let readableElements = [];
  let synth = window.speechSynthesis;
  let currentUtterance = null;

  function generatePageHtml(pageNum, paragraphs) {
    if (!paragraphs) return `<h1>End of Book</h1>`;

    let html = `<h1>The Mystery of Blackwood Forest — Page ${pageNum}</h1>`;
    paragraphs.forEach(rawParagraph => {
      let processedText = rawParagraph;

      phrasesList.forEach(phrase => {
        const regex = new RegExp(`\\b(${phrase})\\b`, 'gi');
        processedText = processedText.replace(regex, '___PHRASE___$1___ENDPHRASE___');
      });

      const tokens = processedText.split(' ');
      let isInsidePhrase = false;
      let currentPhraseWords = [];
      let paragraphHtml = [];

      tokens.forEach(token => {
        if (token.includes('___PHRASE___')) {
          isInsidePhrase = true;
          currentPhraseWords.push(token.replace('___PHRASE___', ''));
        } else if (token.includes('___ENDPHRASE___')) {
          currentPhraseWords.push(token.replace('___ENDPHRASE___', ''));
          const fullPhrase = currentPhraseWords.join(' ');
          const cleanPhrase = fullPhrase.replace(/[^\w\s]/g, "");
          paragraphHtml.push(`<span class="word phrase-highlight" data-clean="${cleanPhrase}">${fullPhrase}</span>`);
          isInsidePhrase = false;
          currentPhraseWords = [];
        } else if (isInsidePhrase) {
          currentPhraseWords.push(token);
        } else {
          const cleanWord = token.replace(/[^\w]/g, "");
          if (cleanWord) {
            paragraphHtml.push(`<span class="word" data-clean="${cleanWord}">${token}</span>`);
          } else {
            paragraphHtml.push(token);
          }
        }
      });

      html += `<p class="reader-paragraph">${paragraphHtml.join(' ')}</p>`;
    });

    return html;
  }

  function renderPages() {
    const wrapper = document.getElementById('pages-wrapper');
    wrapper.innerHTML = '';
    phrasesList.sort((a, b) => b.length - a.length);

    for (let i = 0; i < totalSheets; i++) {
      const frontPageNum = (i * 2) + 1;
      const backPageNum = (i * 2) + 2;

      const sheetElem = document.createElement('div');
      sheetElem.className = 'paper-sheet';
      sheetElem.id = `sheet-${i}`;

      const frontFace = document.createElement('div');
      frontFace.className = 'page-face page-front';
      frontFace.innerHTML = generatePageHtml(frontPageNum, pagesData[frontPageNum - 1]);

      const backFace = document.createElement('div');
      backFace.className = 'page-face page-back';
      backFace.innerHTML = generatePageHtml(backPageNum, pagesData[backPageNum - 1]);

      sheetElem.appendChild(frontFace);
      sheetElem.appendChild(backFace);
      wrapper.appendChild(sheetElem);
    }
    updateZIndexes();
    updateReadableElements();
  }

  function updateZIndexes() {
    for (let i = 0; i < totalSheets; i++) {
      const sheet = document.getElementById(`sheet-${i}`);
      if (i < currentSheetIndex) {
        sheet.style.zIndex = i + 1;
      } else {
        sheet.style.zIndex = totalSheets - i;
      }
    }
  }

  // NAČÍTANIE SLOVÍČOK AKTUÁLNE VIDITEĽNEJ STRANY
  function updateReadableElements() {
    const currentSheet = document.getElementById(`sheet-${currentSheetIndex}`);
    if (!currentSheet) return;
    
    // Zisťujeme, či sme na lícnej (front) alebo rubovej (back) strane
    const pageFace = currentSheetIndex === 0 
      ? currentSheet.querySelector('.page-front') 
      : currentSheet.querySelector('.page-front'); 
    
    readableElements = Array.from(pageFace.querySelectorAll('.word'));
  }

  // LOGIKA TLAČIDLA PLAY / STOP
  function togglePlay() {
    if (isPlaying) {
      stopSpeech();
    } else {
      startSpeech();
    }
  }

  function startSpeech() {
    isPlaying = true;
    const playBtn = document.getElementById('play-btn');
    playBtn.innerText = '⏹ Zastaviť';
    playBtn.classList.add('playing');
    
    updateReadableElements();
    readNextWord();
  }

  function stopSpeech() {
    isPlaying = false;
    synth.cancel();
    clearWordHighlights();
    const playBtn = document.getElementById('play-btn');
    playBtn.innerText = '▶ Prehrať';
    playBtn.classList.remove('playing');
  }

  function clearWordHighlights() {
    document.querySelectorAll('.word-reading').forEach(el => el.classList.remove('word-reading'));
  }

  // REKURZÍVNE ČÍTANIE SLOV S AUTOMATICKÝM PRETÁČANÍM STRÁN
  function readNextWord() {
    if (!isPlaying) return;

    // Ak sme prečítali celú stranu
    if (currentWordIndex >= readableElements.length) {
      clearWordHighlights();
      currentWordIndex = 0;

      // Pretáčanie na ďalšiu stranu
      if (currentSheetIndex < totalSheets - 1) {
        changePage(1);
        setTimeout(() => {
          updateReadableElements();
          readNextWord();
        }, 600);
      } else {
        stopSpeech(); // Kiec knihy
      }
      return;
    }

    clearWordHighlights();
    const targetEl = readableElements[currentWordIndex];
    targetEl.classList.add('word-reading');

    // Syntéza reči pre 1 slovo/frázu
    const textToRead = targetEl.innerText;
    currentUtterance = new SpeechSynthesisUtterance(textToRead);
    currentUtterance.lang = 'en-US';
    currentUtterance.rate = 0.9; // Mierne pomalšie pre lepšiu výslovnosť

    currentUtterance.onend = () => {
      if (isPlaying) {
        currentWordIndex++;
        readNextWord();
      }
    };

    currentUtterance.onerror = () => {
      if (isPlaying) {
        currentWordIndex++;
        readNextWord();
      }
    };

    synth.speak(currentUtterance);
  }

  function manualChangePage(dir) {
    stopSpeech();
    currentWordIndex = 0;
    changePage(dir);
  }

  function changePage(direction) {
    if (isAnimating) return;
    isAnimating = true;

    document.getElementById('popover').style.display = 'none';

    if (direction === 1 && currentSheetIndex < totalSheets) {
      const sheetToFlip = document.getElementById(`sheet-${currentSheetIndex}`);
      sheetToFlip.classList.add('flipped');
      currentSheetIndex++;

      setTimeout(() => {
        updateZIndexes();
        updateControls();
        updateReadableElements();
        isAnimating = false;
      }, 400);

    } else if (direction === -1 && currentSheetIndex > 0) {
      currentSheetIndex--;
      const sheetToUnflip = document.getElementById(`sheet-${currentSheetIndex}`);
      sheetToUnflip.classList.remove('flipped');

      setTimeout(() => {
        updateZIndexes();
        updateControls();
        updateReadableElements();
        isAnimating = false;
      }, 400);
    } else {
      isAnimating = false;
    }
  }

  function updateControls() {
    const activePageNum = (currentSheetIndex * 2) + 1;
    document.getElementById('page-num').innerText = `Strana ${Math.min(activePageNum, totalPages)} z ${totalPages}`;
    document.getElementById('prev-btn').disabled = (currentSheetIndex === 0);
    document.getElementById('next-btn').disabled = (currentSheetIndex >= totalSheets);
  }

  async function fetchWordData(textToProcess) {
    const ipaElem = document.getElementById('pop-ipa');
    const transElem = document.getElementById('pop-translation');
    
    ipaElem.innerText = "| ... |";
    transElem.innerText = "Načítavam preklad...";
    currentAudioUrl = null;

    const isPhrase = textToProcess.trim().includes(' ');

    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(textToProcess)}&langpair=en|sk`)
      .then(res => res.json())
      .then(data => {
        if (data && data.responseData) {
          transElem.innerText = data.responseData.translatedText.toLowerCase();
        }
      });

    if (!isPhrase) {
      fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${textToProcess}`)
        .then(res => res.json())
        .then(data => {
          if (data && data[0]) {
            const phonetic = data[0].phonetic || (data[0].phonetics.find(p => p.text)?.text) || '';
            ipaElem.innerText = phonetic ? `| ${phonetic} |` : '| - |';
            const audioObj = data[0].phonetics.find(p => p.audio && p.audio.length > 0);
            if (audioObj) currentAudioUrl = audioObj.audio;
          } else {
            ipaElem.innerText = '| - |';
          }
        });
    } else {
      ipaElem.innerText = '| fráza |';
    }
  }

  document.getElementById('pop-audio-btn').addEventListener('click', () => {
    if (currentAudioUrl) {
      new Audio(currentAudioUrl).play();
    } else {
      const currentText = document.getElementById('pop-word').innerText;
      const utterance = new SpeechSynthesisUtterance(currentText);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }
  });

  document.addEventListener('click', (e) => {
    const popover = document.getElementById('popover');

    if (e.target.classList.contains('word')) {
      const cleanText = e.target.dataset.clean;
      const rect = e.target.getBoundingClientRect();
      const containerRect = document.querySelector('.book-container').getBoundingClientRect();

      document.getElementById('pop-word').innerText = cleanText;

      const popoverWidth = 250;
      const leftPos = rect.left - containerRect.left + (rect.width / 2) - (popoverWidth / 2);
      const topPos = rect.top - containerRect.top - 145;

      popover.style.left = `${Math.max(10, leftPos)}px`;
      popover.style.top = `${topPos}px`;
      popover.style.display = 'block';

      fetchWordData(cleanText);
    } else if (!popover.contains(e.target)) {
      popover.style.display = 'none';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') {
      manualChangePage(1);
    } else if (e.key === 'ArrowLeft') {
      manualChangePage(-1);
    }
  });

  function action(type) {
    const text = document.getElementById('pop-word').innerText;
    alert(`Položka "${text}" označená ako: ${type}`);
    document.getElementById('popover').style.display = 'none';
  }

  renderPages();
</script>
</body>
</html>
